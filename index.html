<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoTogether</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5e9;color:#203532;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px}h1{font-size:38px;margin:20px 0 8px}header{color:#0d9488;font-weight:900;font-size:25px}section{background:white;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 6px 24px #2035320b}label{display:block;margin:16px 0 6px;font-weight:600}select,input,button{font:inherit}select,input[type=number]{width:100%;padding:12px;border:1px solid #cbd5cf;border-radius:12px;background:white}button{border:0;border-radius:14px;padding:13px;background:#0d9488;color:white;font-weight:bold;cursor:pointer}button.secondary{background:#e5f4ef;color:#0d9488}button.chip{background:#f1f3ef;color:#203532;margin:4px}button.chip.on{background:#0d9488;color:white}.wide{width:100%;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#526861;font-size:14px}.stop{border-left:3px solid #0d9488;padding:4px 16px;margin:18px 0}.amount{font-size:28px;color:#0d9488;font-weight:800}.tag{background:#ffb86b;padding:5px 10px;border-radius:20px;font-size:12px}progress{width:100%;accent-color:#0d9488}#result[hidden]{display:none}</style><main><header>◉ GoTogether.</header><h1>今天想去哪玩？</h1><p>下一站，一起出發。 ✨</p><span class="tag">V1.0 · 模擬測試版</span><section><form id="form"><label for="city">出遊地區</label><select id="city"><option>桃園大溪</option><option>桃園中壢</option><option>台北萬華</option></select><div class="grid"><div><label for="people">出遊人數</label><input id="people" type="number" min="1" max="20" value="4" required></div><div><label for="budget">每人預算（NT$）</label><input id="budget" type="number" min="100" max="100000" value="800" required></div></div><label for="duration">出遊時間</label><select id="duration"><option>一日遊</option><option>半日遊</option></select><label for="transport">交通方式</label><select id="transport"><option>大眾運輸</option><option>自行開車</option><option>步行（當地集合）</option></select><label>出遊風格</label><div id="chips"></div><button class="wide">✦ 生成專屬行程</button></form><p class="muted">目前使用內建範例與規則，並非即時 AI 或地圖服務。</p></section><section id="result" hidden aria-live="polite"></section><footer class="muted">GoTogether · 讓每一次相聚都值得記住。</footer></main><script>
const $=id=>document.getElementById(id), selected=new Set(['美食','拍照']);for(const s of ['美食','拍照','咖啡廳','大自然','購物','娛樂','浪漫','隨機探險']){let b=document.createElement('button');b.type='button';b.className='chip'+(selected.has(s)?' on':'');b.textContent=s;b.setAttribute('aria-pressed',selected.has(s));b.onclick=()=>{selected.has(s)?selected.delete(s):selected.add(s);b.classList.toggle('on',selected.has(s));b.setAttribute('aria-pressed',selected.has(s))};$('chips').append(b)}
const data={'桃園大溪':[['大溪老街','復古街景與小吃','美食 拍照 購物',180],['大溪木藝生態博物館','日式建築與木藝文化','拍照',0],['大溪中正公園','河岸散步','大自然 浪漫',0],['大溪橋','橋景與合照','拍照 浪漫',0]],'桃園中壢':[['中平路商圈','街頭探索與購物','購物 拍照',0],['老街溪河川教育中心周邊','河岸散步','大自然 拍照',0],['中壢藝術館周邊','藝文街景','娛樂 拍照',0],['中壢觀光夜市','小吃探索（晚間時段）','美食 購物',180]],'台北萬華':[['剝皮寮歷史街區','紅磚街景','拍照',0],['艋舺龍山寺','歷史建築','拍照',0],['西門町','街頭美食與購物','美食 購物 娛樂',180],['西門紅樓周邊','特色街景','拍照 浪漫',0]]};let variant=0,share='';$('form').onsubmit=e=>{e.preventDefault();variant=0;generate()};function generate(){let city=$('city').value,n=+$('people').value,b=+$('budget').value,half=$('duration').value==='半日遊',t=$('transport').value;let rows=data[city].slice().sort((a,b)=>score(b)-score(a));function score(x){return [...selected].filter(s=>x[2].includes(s)).length}if(variant%2||selected.has('隨機探險'))rows.push(rows.shift());rows=rows.slice(0,half?2:4);if(city==='桃園中壢')rows.sort((a,b)=>Number(a[0].includes('夜市'))-Number(b[0].includes('夜市')));let transport=t.includes('步行')?0:t.includes('開車')?180:120,food=half?150:300,cafe=selected.has('咖啡廳')?150:0,total=transport+food+cafe;let times=half?['14:00','16:00']:['10:00','12:00','14:00','17:00'];if(city==='桃園中壢'&&rows.some(x=>x[0].includes('夜市')))times[rows.length-1]='18:00';share=`GoTogether｜${city} ${$('duration').value}\n${n} 人，每人示意 NT$${total}\n`+rows.map((x,i)=>times[i]+' '+x[0]).join('\n')+'\n模擬行程，出發前請查證。';let r=$('result');r.hidden=false;r.innerHTML=`<span class="tag">範例行程 · 非即時資料</span><h2>${city}・好友漫遊</h2><p>${n} 人｜${$('duration').value}｜${t}</p><div class="grid"><div>每人示意花費<div class="amount">$${total}</div></div><div>團體示意花費<div class="amount">$${total*n}</div></div></div><p>${total>b?'⚠️ 超過預算 '+(total-b)+' 元，建議調高預算或調整交通及餐飲。':'預算剩餘 NT$'+(b-total)}</p><progress max="${b}" value="${Math.min(total,b)}"></progress><h3>今日行程</h3>${rows.map((x,i)=>`<div class="stop"><small>${times[i]}（建議時段）</small><h3>${x[0]}</h3><p>${x[1]}。${selected.has('拍照')?'可安排好友合照。':''}</p></div>`).join('')}<h3>預算分類（每人）</h3><p>交通 $${transport}　餐飲 $${food}　咖啡 $${cafe}</p><p class="muted">費用為規劃假設，不是實際票價或店家報價。部分風格尚無專屬景點；咖啡廳未指定店家。請確認開放時間、交通與門票。</p><h3>好友挑戰</h3>${['拍一張創意合照','分享一份美食','記錄今天最喜歡的瞬間'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}<button class="wide" id="copy">複製行程</button><button class="wide secondary" id="share">分享行程</button><button class="wide secondary" id="again">重新生成</button><p id="notice" class="muted"></p>`;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);$('notice').textContent='已複製'}catch{prompt('請手動複製行程',share)}};$('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'GoTogether',text:share})}catch(e){if(e.name!=='AbortError')$('copy').click()}}else $('copy').click()};$('again').onclick=()=>{variant++;generate()};r.scrollIntoView({behavior:'smooth'})}
</script></html>
